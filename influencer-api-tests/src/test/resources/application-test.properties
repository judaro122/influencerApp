# Target Environment Configuration
# Default target points to http://192.168.100.10:8080 (remote test server)
# In CI/Jenkins or local docker, override via -Dtarget.base.url=http://localhost:8080
target.base.url=http://192.168.100.10:8080

# Timeouts in seconds
timeout.connection.seconds=10
timeout.read.seconds=30
timeout.async.polling.seconds=90
polling.interval.seconds=3
